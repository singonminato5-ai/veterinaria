ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# El código PHP interno no debe poder abrirse desde el navegador
<DirectoryMatch "^/var/www/html/(config|controllers|models|views)(/|$)">
    Require all denied
</DirectoryMatch>
