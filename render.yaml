# Blueprint de Render (opcional): Render lo detecta al conectar el repositorio.
services:
  - type: web
    name: veterinaria-sistema
    runtime: docker
    plan: free
    healthCheckPath: /health.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: test
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSL
        value: "1"
      - key: ADMIN_CLAVE
        sync: false
      - key: SECRETARIA_CLAVE
        sync: false
